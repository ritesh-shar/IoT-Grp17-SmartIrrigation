
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smart-irrigation-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -u backend -P \"$${MQTT_PASSWORD}\" -t smart-irrigation/healthcheck -m ok >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
    env_file: .env

  postgres:
    image: postgres:16-alpine
    container_name: smart-irrigation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: irrigation
      POSTGRES_USER: irrigation
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irrigation -d irrigation"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
